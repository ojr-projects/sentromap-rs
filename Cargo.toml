[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ojr-projects/sentromap-rs"

[workspace.dependencies]
sm-core = { path = "crates/sm-core" }
anyhow = "1"
thiserror = "2"
rayon = "1"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tempfile = "3"
proptest = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

# Tests exercise real-genome sizes; keep them reasonably fast.
[profile.test]
opt-level = 2

[profile.bench]
inherits = "release"
